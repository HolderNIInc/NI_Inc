<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloxmon GO — NI Inc</title>
  <link rel="icon" href="images/IconPage.jpg" type="image/x-icon">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      padding: 60px 20px;
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      min-height: 100vh;
    }

    .game-panel {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(20px) saturate(180%);
      padding: 40px;
      border-radius: 20px;
      max-width: 900px;
      margin: auto;
      box-shadow: 0 0 30px rgba(58,128,244,0.6);
    }

    .game-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      align-items: center;
    }

    .game-image {
      width: 280px;
      height: 280px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 0 12px #3a80f4;
    }

    h1 {
      font-size: 2.5em;
      color: #bb86fc;
      text-shadow: 0 0 10px #bb86fc;
    }

    p { font-size: 1.2em; }

    ul li { margin-bottom: 10px; }

    .play-btn, .secondary-btn {
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      display: block;
    }

    .play-btn {
      background: #3a80f4;
      color: white;
      border: none;
      box-shadow: 0 0 10px #3a80f4;
    }

    .secondary-btn {
      background: transparent;
      color: #bb86fc;
      border: 2px solid #bb86fc;
    }

    /* ===== Overlay Inicializando Roblox ===== */
    .roblox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      text-align: center;
    }

    .roblox-box {
      background: rgba(20,20,20,0.9);
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 0 25px #3a80f4;
      animation: fadeIn 0.4s ease;
    }

    .roblox-box h2 {
      color: #bb86fc;
      margin-bottom: 15px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #3a80f4;
      border-radius: 50%;
      margin: 0 auto 15px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>

<div class="game-panel">
  <div class="game-layout">
    <img src="images/BloxmonGOIcon.png" class="game-image">

    <div style="flex:1">
      <h1>Bloxmon GO</h1>
      <p>Este juego está en desarrollo.</p>

      <button class="play-btn" onclick="startRoblox()">
        Jugar en Roblox
      </button>

      <button class="secondary-btn"
        onclick="window.open('https://www.roblox.com/games/88756231287275','_blank')">
        Ver en Roblox
      </button>
    </div>
  </div>
</div>

<!-- Overlay -->
<div class="roblox-overlay" id="robloxOverlay">
  <div class="roblox-box">
    <div class="spinner"></div>
    <h2 id="rbxTitle">Inicializando Roblox</h2>
    <p id="rbxText">Prepárate para unirte a la experiencia…</p>
  </div>
</div>

<!-- Audio -->
<audio id="bg-audio" autoplay loop></audio>

<script>
  const GAME_ID = 88756231287275;

  function startRoblox() {
    const overlay = document.getElementById("robloxOverlay");
    const title = document.getElementById("rbxTitle");
    const text = document.getElementById("rbxText");

    overlay.style.display = "flex";

    // Intentar abrir Roblox
    setTimeout(() => {
      window.location.href = `roblox://placeId=${GAME_ID}`;
    }, 800);

    // Después de 10s cambia el mensaje
    setTimeout(() => {
      title.textContent = "¿Problemas al entrar?";
      text.textContent =
        "No te preocupes, se cerrará esta ventana e inténtalo de nuevo.";
    }, 10000);

    // 3s después se cierra SOLO el overlay
    setTimeout(() => {
      overlay.style.display = "none";
    }, 13000);
  }
</script>

</body>
</html>
