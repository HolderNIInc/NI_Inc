<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloxmon GO — NI Inc</title>
  <link rel="icon" href="images/IconPage.jpg" type="image/x-icon">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      padding: 60px 20px;
      transition: background 1s ease-in-out;
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      min-height: 100vh;
    }

    .game-panel {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: 40px;
      border-radius: 20px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 0 30px rgba(58,128,244,0.6);
      margin: auto;
    }

    .game-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      align-items: center;
    }

    .game-image {
      width: 280px;
      height: 280px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 0 12px #3a80f4;
    }

    h1 {
      font-size: 2.5em;
      color: #bb86fc;
      text-shadow: 0 0 10px #bb86fc;
      margin-bottom: 15px;
    }

    p { font-size: 1.2em; line-height: 1.6; margin-bottom: 20px; }

    ul { font-size: 1.1em; margin: 20px 0; padding-left: 20px; }
    ul li { margin-bottom: 10px; }

    .play-btn, .secondary-btn {
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1em;
      cursor: pointer;
      margin-top: 15px;
      display: block;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .play-btn {
      background-color: #3a80f4;
      color: white;
      border: none;
      box-shadow: 0 0 10px #3a80f4;
    }
    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #3a80f4;
    }

    .secondary-btn {
      background-color: transparent;
      color: #bb86fc;
      border: 2px solid #bb86fc;
    }
    .secondary-btn:hover {
      background-color: #bb86fc;
      color: white;
    }

    .back-link {
      margin-top: 40px;
      text-align: center;
    }

    .back-link a {
      background-color: #bb86fc;
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      box-shadow: 0 0 8px #bb86fc;
    }

    .notice {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0,0,0,0.6);
      color: #bb86fc;
      font-size: 1.6em;
      text-shadow: 0 0 10px #bb86fc;
      animation: pulse 1.5s infinite;
      z-index: 9999;
    }

    @keyframes pulse {
      0% { opacity: .4; }
      50% { opacity: 1; }
      100% { opacity: .4; }
    }

    #robloxOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      text-align: center;
    }

    #robloxBox {
      background: #121212;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 0 25px #3a80f4;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,.2);
      border-top: 4px solid #3a80f4;
      border-radius: 50%;
      margin: 0 auto 15px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<div id="notice" class="notice">Refresca la página</div>

<div class="game-panel">
  <div class="game-layout">
    <img src="images/BloxmonGOIcon.png" class="game-image">

    <div style="flex:1;min-width:250px;">
      <h1>Bloxmon GO</h1>
      <p><strong>Descripción:</strong> Este juego está en desarrollo.</p>

      <ul>
        <li></li><li></li><li></li><li></li>
      </ul>

      <button class="play-btn" onclick="startRoblox()">Jugar en Roblox</button>

      <button class="secondary-btn"
        onclick="window.open('https://www.roblox.com/games/88756231287275','_blank')">
        Ver en Roblox
      </button>
    </div>
  </div>

  <div class="back-link">
    <a href="informacion.html">← Volver</a>
  </div>
</div>

<div id="robloxOverlay">
  <div id="robloxBox">
    <div class="spinner"></div>
    <h2 id="rbxTitle" style="color:#bb86fc">Inicializando Roblox</h2>
    <p id="rbxText">Prepárate para unirte…</p>
  </div>
</div>

<audio id="bg-audio" autoplay loop preload="auto"></audio>

<script>
/* DÍA / NOCHE (SIN TOCAR) */
const DAY_START = 390;
const NIGHT_START = 1110;
const DAY_BG = "images/Diablox.jpg";
const NIGHT_BG = "images/Nocheblox.jpg";
const DAY_SONG = "audios/DayFestivalSong.mp3";
const NIGHT_SONG = "audios/";

function isDay() {
  const n = new Date();
  const t = n.getHours()*60 + n.getMinutes();
  return t >= DAY_START && t < NIGHT_START;
}

function setTheme() {
  const audio = document.getElementById("bg-audio");
  const day = isDay();

  document.body.style.backgroundImage =
    day ? `url('${DAY_BG}')` : `url('${NIGHT_BG}')`;

  const src = day ? DAY_SONG : NIGHT_SONG;
  if (!audio.src.endsWith(src)) {
    audio.src = src;
    audio.play().catch(()=> {
      document.getElementById("notice").style.display="grid";
    });
  }
}

window.onload = () => {
  setTheme();
  setInterval(setTheme, 60000);
};

/* ✅ FIX DEFINITIVO DEL BUG */
let robloxTimers = [];

function startRoblox() {
  robloxTimers.forEach(t => clearTimeout(t));
  robloxTimers = [];

  const o = document.getElementById("robloxOverlay");
  const t = document.getElementById("rbxTitle");
  const p = document.getElementById("rbxText");

  t.textContent = "Inicializando Roblox";
  p.textContent = "Prepárate para unirte…";
  o.style.display = "flex";

  robloxTimers.push(setTimeout(() => {
    window.location.href = "roblox://placeId=88756231287275";
  }, 800));

  robloxTimers.push(setTimeout(() => {
    t.textContent = "¿Problemas al entrar?";
    p.textContent = "Se cerrará esta ventana e inténtalo de nuevo.";
  }, 10000));

  robloxTimers.push(setTimeout(() => {
    o.style.display = "none";
  }, 13000));
}
</script>

</body>
</html>
