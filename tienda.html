<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de NI Inc</title>
  <link rel="icon" href="images/IconPage.jpg" type="image/x-icon">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f0f0f;
      color: #fff;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #e100ff;
      text-shadow: 0 0 5px #ae00ff;
      margin-top: 60px;
    }
    .menu-toggle {
      position: fixed;
      top: 15px;
      left: 15px;
      background-color: #00c3ff;
      color: #000;
      border: none;
      padding: 10px 14px;
      font-size: 20px;
      border-radius: 8px;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 0 8px #00c3ff;
    }
    .menu-categorias {
      position: fixed;
      top: 60px;
      left: 15px;
      background: rgba(0, 0, 0, 0.85);
      padding: 10px;
      border-radius: 10px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 999;
      box-shadow: 0 0 10px #00c3ff;
    }
    .menu-categorias button {
      background-color: #00c3ff;
      color: #000;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .menu-categorias button:hover {
      background-color: #00a0cc;
    }
    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      margin-top: 40px;
    }
    .item-card {
      position: relative;
      background-color: #1a1a1a;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 0 10px rgba(0,195,255,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
    }
    .item-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0,195,255,0.5);
    }
    .item-image {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
      margin-bottom: 10px;
    }
    .item-title {
      font-size: 1.1em;
      color: #fff;
      margin-bottom: 5px;
    }
    .item-description {
      font-size: 0.9em;
      color: #ccc;
      margin-bottom: 10px;
    }
    .buy-button {
      background-color: #00c3ff;
      color: #000;
      padding: 10px 20px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
      display: inline-block;
      font-size: 13px;
    }
    .buy-button:hover {
      background-color: #00a0cc;
    }
    .item-label {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      font-size: 0.8em;
      font-weight: bold;
      border-radius: 12px;
      box-shadow: 0 0 5px rgba(0,0,0,0.4);
      z-index: 3;
    }
    .item-label.new {
      background-color: #00ffb3;
      color: #000;
    }
    .item-label.limited {
      background-color: #ff3b3b;
      color: #fff;
    }
    .item-card.horizontal {
      display: flex;
      flex-direction: row;
      gap: 14px;
      align-items: flex-start;
      max-width: 400px;
      padding: 10px;
      border-radius: 8px;
    }
    .item-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 14px;
      max-width: 240px;
    }
    .robux-info {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 8px;
      gap: 6px;
    }
    .robux-icon {
      width: 24px;
      height: 24px;
    }
    .robux-amount {
      font-weight: bold;
      color: #00aa00;
      font-size: 14px;
    }
    #videoFondo {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 0.3;
    }
    .section {
      display: none;
    }
    #instruccion {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border: 2px solid #00c3ff;
      font-size: 1.2rem;
      z-index: 9999;
      animation: fadeOut 10s forwards;
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
  </style>
</head>
<body>
  <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  <div class="menu-categorias" id="menuCategorias">
    <button onclick="mostrarSeccion('camisas')">Camisas clásicas</button>
    <button onclick="mostrarSeccion('pantalones')">Pantalones clásicas</button>
  </div>
  <div id="instruccion">Presiona el ícono ☰ y elige una categoría para ver los productos</div>
  <h1>Tienda de NI Inc</h1>
  <div id="camisas" class="store-grid section">
    <div class="item-card horizontal">
      <div class="item-preview">
        <img src="images/Producto1.webp" alt="Producto1" class="item-image">
      </div>
      <div class="item-info">
        <div class="item-label new">Nuevo</div>
        <div class="item-title">Camisa de un pelotocino</div>
        <div class="item-description">Camisa dinámica de Roblox pero con guantes.</div>
        <div class="robux-info">
          <img src="images/robuxicon.png" alt="Robux Icon" class="robux-icon">
          <span class="robux-amount">5 robux</span>
        </div>
        <a class="buy-button" href="https://www.roblox.com/catalog/14977456983" target="_blank">Obtener</a>
      </div>
    </div>
  </div>
  <div id="pantalones" class="store-grid section">
    <div class="item-card horizontal">
      <div class="item-preview">
        <img src="images/Pantalon1.webp" alt="Pantalón1" class="item-image">
      </div>
      <div class="item-info">
        <div class="item-label limited">Limitado</div>
        <div class="item-title">Pantalón negro clásico</div>
        <div class="item-description">Ideal para cualquier avatar Roblox.</div>
        <div class="robux-info">
          <img src="images/robuxicon.png" alt="Robux Icon" class="robux-icon">
          <span class="robux-amount">7 robux</span>
        </div>
        <a class="buy-button" href="https://www.roblox.com/catalog/14977456984" target="_blank">Obtener</a>
      </div>
    </div>
  </div>

  <video autoplay muted loop id="videoFondo">
    <source src="videos/Fondo2.mp4" type="video/mp4">
    Tu navegador no soporta video HTML5.
  </video>

  <audio id="audioFondo" autoplay loop>
    <source src="audios/Doukashiteru.mp3" type="audio/mpeg">
    Tu navegador no soporta audio HTML5.
  </audio>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('menuCategorias');
      menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    function mostrarSeccion(id) {
      const secciones = document.querySelectorAll('.section');
      secciones.forEach(sec => sec.style.display = 'none');
      const activa = document.getElementById(id);
      if (activa) {
        activa.style.display = 'grid';
        activa.scrollIntoView({ behavior: 'smooth' });
        toggleMenu();
      }
    }

    window.onload = () => {
      const secciones = document.querySelectorAll('.section');
      secciones.forEach(sec => sec.style.display = 'none');
      setTimeout(() => {
        const instruccion = document.getElementById('instruccion');
        if (instruccion) instruccion.style.display = 'none';
      }, 10000);
    };
  </script>
</body>
    </html>
