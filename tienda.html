<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/IconPage.jpg" type="image/x-icon">
  <title>TIENDA</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      background: #000;
    }

    /* VIDEO */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      transition: opacity 1s ease;
    }

    .video-bg.fade-out { opacity: 0; }

    .video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: -1;
      transition: opacity 1s ease;
    }

    .video-overlay.fade-out { opacity: 0; }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px 100px;
      text-align: center;
    }

    h1 { font-size: 42px; }
    p { color: #ccc; font-size: 18px; }

    /* ACORDEÓN */
    .accordion {
      background: #1b1b1b;
      border-radius: 10px;
      margin: 20px 0;
      text-align: left;
    }

    .accordion-header {
      padding: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #232323;
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease;
      padding: 0 18px;
    }

    .accordion-content p { margin: 15px 0; }

    /* BOTONES */
    .btn {
      margin-top: 30px;
      padding: 16px 36px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #00a2ff;
      color: #fff;
    }

    .back-menu {
      margin-top: 60px;
      opacity: 0;
      animation: fadeInUp .8s forwards;
    }

    .back-menu button {
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #444, #222);
      color: #fff;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* LOADER */
    .loader-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .loader-box {
      background: #121212;
      padding: 30px;
      border-radius: 12px;
      width: 280px;
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top: 4px solid #00a2ff;
      border-radius: 50%;
      margin: auto;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="video-bg" id="videoBg">
  <video autoplay muted loop playsinline>
    <source src="videos/Fondo3.mp4" type="video/mp4">
  </video>
</div>
<div class="video-overlay" id="videoOverlay"></div>

<audio id="bgAudio" loop>
  <source src="audios/" type="audio/mpeg">
</audio>

<div class="container">
  <h1>TIENDA</h1>
  <p>Transladamos la tienda a Roblox</p>

  <div class="accordion">
    <div class="accordion-header" onclick="toggleAccordion(this)">
      ¿Por qué este cambio?
    </div>
    <div class="accordion-content">
      <p>Ahora la compra es más rápida y directa desde Roblox.</p>
    </div>
  </div>

  <div class="accordion">
    <div class="accordion-header" onclick="toggleAccordion(this)">
      Manual de compra en la nueva Tienda
    </div>
    <div class="accordion-content">
      <p>Entra → Roblox abre → compra → disfruta.</p>
    </div>
  </div>

  <button class="btn" onclick="irATienda()">ENTRAR A LA TIENDA</button>

  <div class="back-menu">
    <button onclick="confirmarSalida()">⬅ Regresar al Menu</button>
  </div>
</div>

<div class="loader-overlay" id="robloxLoader">
  <div class="loader-box">
    <div class="spinner"></div>
    <h3 id="loaderTitulo">Roblox se está cargando</h3>
    <p id="loaderTexto">Prepárate para unirte...</p>
  </div>
</div>

<script>
let loaderActivo = false;

function toggleAccordion(h) {
  const c = h.nextElementSibling;
  c.style.maxHeight = c.style.maxHeight ? null : c.scrollHeight + "px";
}

function irATienda() {
  if (loaderActivo) return;
  loaderActivo = true;

  const loader = document.getElementById("robloxLoader");
  const t = document.getElementById("loaderTitulo");
  const p = document.getElementById("loaderTexto");

  loader.style.display = "flex";
  t.textContent = "Roblox se está cargando";
  p.textContent = "Prepárate para unirte...";

  setTimeout(() => {
    if (!loaderActivo) return;
    p.textContent = "Inicializando experiencia...";
  }, 1500);

  setTimeout(() => {
    if (!loaderActivo) return;
    t.textContent = "Redirigiendo";
    p.textContent = "Abriendo Roblox...";
    window.open(

      "https://www.roblox.com/games/15099460018",
      "_blank"
      );
  }, 3500);

  setTimeout(() => {
    if (!loaderActivo) return;
    t.textContent = "¿Problemas al entrar?";
    p.textContent = "Se cerrará esta ventana e inténtalo de nuevo.";
    setTimeout(() => {
      loader.style.display = "none";
      loaderActivo = false;
    }, 3000);
  }, 10000);
}

function confirmarSalida() {
  if (!confirm("¿Seguro que deseas regresar al Menu?")) return;

  document.getElementById("videoBg").classList.add("fade-out");
  document.getElementById("videoOverlay").classList.add("fade-out");

  setTimeout(() => {
    location.href = "https://holderniinc.github.io/NI_Inc/Menu.html";
  }, 1000);
}
</script>

</body>
  </html>
