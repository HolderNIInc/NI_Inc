<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Descargas | NI Inc</title>
  <link rel="icon" href="images/IconPage.jpg" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: url("images/Fondo.jpg") no-repeat center center fixed;
      background-size: cover;
      background-position: center;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: -1;
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
      max-width: 600px;
    }

    .btn-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .windows-download,
    .android-download {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .info-icon {
      width: 22px;
      height: 22px;
      cursor: pointer;
      opacity: 0.8;
      transition: transform 0.3s ease;
    }

    .info-icon:hover {
      transform: scale(1.1);
      opacity: 1;
    }

    .info-box {
      position: absolute;
      top: 50px;
      right: -10px;
      background: rgba(0, 0, 0, 0.85);
      color: #00c3ff;
      padding: 15px;
      border-radius: 8px;
      font-size: 0.95em;
      width: 260px;
      box-shadow: 0 0 10px #00c3ff;
      display: none;
      animation: fadeIn 0.4s ease forwards;
      z-index: 10;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="overlay"></div>

  <div class="content">
    <h1>Descarga el iniciador de NI Inc </h1>
    <p>Disponible para Windows y Android</p>
    <div class="btn-group">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
        
        <!-- Botón Windows con ícono y cuadro de info -->
        <div class="windows-download" id="windowsDownload">
          <a href="https://www.dropbox.com/scl/fi/68yo2p4aglm2eajflianf/NI-Inc-Launcher-Setup-v1.0.0.exe?rlkey=ixi6i3hjgbc43dll7iwvj1etn&st=x77yid1x&dl=1" download>
            <img src="images/Download_for_windows_button.jpg" alt="Descargar para Windows" style="width:220px; height:auto;">
          </a>
          <img src="images/infoicon.png" alt="Información" class="info-icon" onclick="toggleInfoBox('infoBoxWindows', event)">
          <div id="infoBoxWindows" class="info-box">
  Compatible con Windows 11/10.<br><br>
          </div>
        </div>

        <!-- Botón Android con ícono y cuadro de info -->
        <div class="android-download" id="androidDownload">
          <a href="https://www.dropbox.com/scl/fi/u2d7vrs9feuuzf908ds2j/NI-Inc-Launcher.apk?rlkey=o58yofh139bcxcr938gw6yn6a&st=2dhhw7if&dl=1" download>
            <img src="images/Download_for_android_button.jpg" alt="Descargar para Android" style="width:220px; height:auto;">
          </a>
          <img src="images/infoicon.png" alt="Información" class="info-icon" onclick="toggleInfoBox('infoBoxAndroid', event)">
          <div id="infoBoxAndroid" class="info-box">
  Esta versión está optimizada para Android 12 o superior. Para instalar la app <a href="https://youtu.be/Dl_OuYOCyEU?si=bxsjdlsQTDO4ngfE" target="_blank" style="color:#00c3ff; text-decoration: underline;">haga click</a> acá para ver el tutorial.<br><br>Compatible con la mayoría de dispositivos modernos.
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    function toggleInfoBox(id, event) {
      event.stopPropagation();
      const box = document.getElementById(id);
      const allBoxes = document.querySelectorAll('.info-box');
      allBoxes.forEach(b => { if (b !== box) b.style.display = 'none'; });
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    document.addEventListener('click', function () {
      document.querySelectorAll('.info-box').forEach(box => box.style.display = 'none');
    });

    document.getElementById('windowsDownload').addEventListener('click', function (e) {
      e.stopPropagation();
    });

    document.getElementById('androidDownload').addEventListener('click', function (e) {
      e.stopPropagation();
    });
  </script>

</body>
</html>
