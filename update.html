<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar App — NI Inc</title>
  <link rel="icon" href="images/IconPage.jpg" type="image/x-icon">
  <link rel="preload" href="fonts/BobloxClassic-nRjl4.ttf" as="font" type="font/ttf" crossorigin>
  
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      background: url('images/Fondo.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

 @font-face {
  font-family: "BobloxClassic";
  src: url("fonts/BobloxClassic-nRjl4.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

 html, body, * {
  font-family: "BobloxClassic" !important;
}

@font-face {
  font-family: "BobloxClassic";
  src: url("fonts/BobloxClassic.woff2") format("woff2"),
       url("fonts/BobloxClassic-nRjl4.ttf") format("truetype");
  font-display: swap;
}

    * {
      box-sizing: border-box;
      font-family: 'BobloxClassic', sans-serif !important;
    }
    
    .header {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 1.4em;
      font-weight: bold;
      color: yellow;
      text-shadow: 0 0 8px #000;
    }

    .update-panel {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(58,128,244,0.6);
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 2.2em;
      color: #bb86fc;
      text-shadow: 0 0 10px #bb86fc;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 20px;
    }

    .version-info {
      font-size: 1.1em;
      margin-bottom: 30px;
      color: #ffd700;
      text-shadow: 0 0 6px #000;
    }

    .update-btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1.2em;
      cursor: pointer;
      background-color: #3a80f4;
      color: white;
      border: none;
      box-shadow: 0 0 10px #3a80f4;
      transition: transform 0.3s, box-shadow 0.3s;
      text-decoration: none;
      margin: 10px 0;
    }

    .update-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #3a80f4;
    }

    .android-btn {
      background-color: #3ddc84;
      box-shadow: 0 0 10px #3ddc84;
    }

    .android-btn:hover {
      box-shadow: 0 0 15px #3ddc84;
    }

     html, body, * {
    cursor: url("cursors/Arrow.cur") 0 0, auto !important;
  }

  button, a {
    cursor: url("cursors/Hand.cur") 0 0, pointer !important;
  }

  input, textarea {
    cursor: url("cursors/Text.ani") 0 0, text !important;
  }

    /* AJUSTES PARA MOVIL */

@media (max-width: 768px){

  body{
    background-attachment: scroll; /* evita bugs del fondo en móvil */
  }
    
  </style>
</head>
<body>

  <div class="header"> </div>

  <div class="update-panel">
    <h1>Actualización Disponible</h1>
    <p>Tu aplicación tiene una nueva versión lista para instalar.<br>
       Mantente al día con las últimas mejoras y correcciones.</p>

    <div class="version-info">
      Nueva versión: <strong>2.0.1</strong>
    </div>

    <!-- Botón Windows -->
    <a href="https://www.dropbox.com/scl/fi/82o820380ptr3tzauc4sc/NIINC-App-2.0.1-BETA.msi?rlkey=2ratj3v5qf4zay7yduoyq5s6r&st=96lk105g&dl=1" class="update-btn">
      Actualizar para Windows
    </a>

    <!-- Botón Android -->
    <a href="https://www.dropbox.com/scl/fi/6ia9plaswztk6pu42pfc3/NI-INC-App-v2.0.1-BETA.apk?rlkey=0l8q7n0iku50ayhcuk5c8py89&st=cqhn34rv&dl=1" class="update-btn android-btn">
      Actualizar para Android
    </a>

  </div>

</body>
</html>
