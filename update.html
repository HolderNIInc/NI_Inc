<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar App — NI Inc</title>
  <link rel="icon" href="images/IconPage.jpg" type="image/x-icon">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      background: url('images/Fondo.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .header {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 1.4em;
      font-weight: bold;
      color: yellow;
      text-shadow: 0 0 8px #000;
    }

    .update-panel {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(58,128,244,0.6);
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 2.2em;
      color: #bb86fc;
      text-shadow: 0 0 10px #bb86fc;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 20px;
    }

    .version-info {
      font-size: 1.1em;
      margin-bottom: 30px;
      color: #ffd700;
      text-shadow: 0 0 6px #000;
    }

    .update-btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1.2em;
      cursor: pointer;
      background-color: #3a80f4;
      color: white;
      border: none;
      box-shadow: 0 0 10px #3a80f4;
      transition: transform 0.3s, box-shadow 0.3s;
      text-decoration: none;
      margin: 10px 0;
    }

    .update-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #3a80f4;
    }

    .android-btn {
      background-color: #3ddc84;
      box-shadow: 0 0 10px #3ddc84;
    }

    .android-btn:hover {
      box-shadow: 0 0 15px #3ddc84;
    }

  </style>
</head>
<body>

  <div class="header">Actualizador para la App de NI INC</div>

  <div class="update-panel">
    <h1>Actualización Disponible</h1>
    <p>Tu aplicación tiene una nueva versión lista para instalar.<br>
       Mantente al día con las últimas mejoras y correcciones.</p>

    <div class="version-info">
      Nueva versión: <strong>2.0.1</strong>
    </div>

    <!-- Botón Windows -->
    <a href="https://www.dropbox.com/scl/fi/dt5j8cpzki5vm6b0tk1jj/NIINC-App-2.0.1.msi?rlkey=ps5lw4jaj2kro84gcgic57rr1&st=j98b809j&dl=1" class="update-btn">
      Actualizar para Windows
    </a>

    <!-- Botón Android -->
    <a href="https://www.dropbox.com/scl/fi/7iiwzur88hbl058v9gr5x/NI_INC_App_v2.0.1_-BETA.apk?rlkey=nf84dukjod681pwfo4pymb5lt&st=4ef10bdy&dl=1" class="update-btn android-btn">
      Actualizar para Android
    </a>

  </div>

</body>
</html>
