<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Información</title>

<link rel="icon" href="IconPage.jpg">

<style>

body{
font-family: Arial, sans-serif;
margin:0;
padding:0;
color:white;
background-image:url("Fondo.jpg");
background-size:cover;
background-position:center;
background-attachment:fixed;
}

/* Pantalla de carga */

.loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

.spinner{
width:40px;
height:40px;
border:4px solid rgba(255,255,255,0.2);
border-top:4px solid #38bdf8;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

.loader p{
margin-top:10px;
color:#94a3b8;
}

/* Contenido */

.content{
display:none;
min-height:100vh;
display:flex;
flex-direction:column;
}

.info{
flex:1;
padding:40px;
max-width:800px;
margin:auto;
background:rgba(0,0,0,0.4);
border-radius:10px;
}

.footer{
text-align:center;
padding:30px;
}

button{
background:#38bdf8;
border:none;
padding:12px 30px;
border-radius:8px;
font-size:16px;
cursor:pointer;
transition:0.2s;
}

button:hover{
background:#0ea5e9;
}

</style>
</head>

<body>

<div class="loader" id="loader">
<div class="spinner"></div>
<p>Cargando información...</p>
</div>

<div class="content" id="content">

<div class="info">

<h1>Información</h1>

<p>
Aquí puedes colocar la información de tu aplicación, empresa o proyecto.
Este apartado sirve para explicar detalles importantes.
</p>

<p>
Puedes modificar este texto y agregar más contenido cuando quieras.
</p>

</div>

<div class="footer">

<button onclick="window.location.href='https://holderniinc.github.io/NI_Inc/Menu.html'">
Regresar
</button>

</div>

</div>

<script>

/* Animación de carga */

window.onload = function(){
setTimeout(function(){
document.getElementById("loader").style.display="none";
document.getElementById("content").style.display="flex";
},1500);
}

</script>

</body>
</html>
