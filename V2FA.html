<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificación | NI Inc</title>
  <link rel="icon" href="images/IconPage.jpg" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      animation: fadeIn 1s ease;
      position: relative;
      z-index: 1;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: url("images/Fondo.jpg") no-repeat center center fixed;
      background-size: cover;
      z-index: -2;
    }

    h1 {
      color: #00c3ff;
      text-shadow: 0 0 8px #00c3ff;
      font-size: 2.2em;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.1em;
      max-width: 500px;
      margin-bottom: 30px;
      line-height: 1.5em;
    }

    .btn {
      padding: 12px 24px;
      background: #00c3ff;
      color: black;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: not-allowed;
      font-size: 1em;
      transition: background 0.3s ease, transform 0.3s ease;
      opacity: 0.5;
    }

    .btn.active {
      cursor: pointer;
      opacity: 1;
    }

    .btn.active:hover {
      background: #00a0cc;
      transform: scale(1.05);
    }

    .h-captcha {
      margin-bottom: 20px;
    }

    footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 0.9em;
      color: #888;
      z-index: 2;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media screen and (max-width: 480px) {
      h1 {
        font-size: 1.8em;
      }
      p {
        font-size: 1em;
      }
      .btn {
        width: 100%;
      }
    }

    @keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="loader" style="
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: #0f0f0f;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  flex-direction: column;
  color: #00c3ff;
  font-family: 'Segoe UI', sans-serif;
  font-size: 1.2em;
  text-align: center;
">
  <div class="spinner" style="
    width: 50px;
    height: 50px;
    border: 6px solid #00c3ff;
    border-top: 6px solid transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  "></div>
  Cargando sistema...
  </div>
  <h1>Verificación de seguridad</h1>

  <form id="captchaForm">
    <div class="h-captcha" data-sitekey="0a5044fa-296e-4556-99b6-f7fefc6cd23c" data-callback="onVerified"></div>
    <button type="submit" class="btn" id="continuarBtn" disabled>Continuar</button>
  </form>

  <footer style="position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 0.9em; color: white; z-index: 2;">
  🔒 Esta página está protegida con <strong>hCaptcha</strong>
  </footer>

  <audio autoplay loop>
    <source src="audios/Lofi.mp3" type="audio/mpeg">
    Tu navegador no soporta audio HTML5.
  </audio>

  <script>
    function onVerified(token) {
      const btn = document.getElementById("continuarBtn");
      btn.disabled = false;
      btn.classList.add("active");
    }

    document.getElementById("captchaForm").addEventListener("submit", function(e) {
      e.preventDefault();
      window.location.href = "descarga.html";
    });
  </script>

  <script>
    fetch("https://vpnapi.io/api/?key=TU_API_KEY")
      .then(response => response.json())
      .then(data => {
        if (data.security && data.security.vpn === true) {
          alert("Acceso denegado: se detectó uso de VPN.");
          window.location.href = "https://www.google.com";
        }
      })
      .catch(error => {
        console.warn("No se pudo verificar VPN:", error);
      });
  </script>

  <script>
  window.addEventListener("load", function() {
    const loader = document.getElementById("loader");
    loader.style.opacity = "0";
    loader.style.transition = "opacity 0.5s ease";
    setTimeout(() => loader.style.display = "none", 500);
  });
  </script>

  <script>
  function onVerified(token) {
    const btn = document.getElementById("continuarBtn");
    btn.disabled = false;
    btn.classList.add("active");

    // Crear contador visual
    const countdown = document.createElement("div");
    countdown.id = "countdown";
    countdown.style.marginTop = "15px";
    countdown.style.fontSize = "1em";
    countdown.style.color = "#00c3ff";
    countdown.textContent = "Tiempo restante: 10 segundos";
    btn.parentNode.appendChild(countdown);

    // Iniciar cuenta regresiva
    let seconds = 10;
    const interval = setInterval(() => {
      seconds--;
      countdown.textContent = `Tiempo restante: ${seconds} segundos`;
      if (seconds <= 0) {
        clearInterval(interval);
        location.reload(); // Recargar la página
      }
    }, 1000);
  }

  document.getElementById("captchaForm").addEventListener("submit", function(e) {
    e.preventDefault();
    window.location.href = "descarga.html";
  });
      </script>

  <script>
  if (location.protocol !== 'https:') {
    alert("Advertencia: estás accediendo sin una conexión segura (HTTP). Se recomienda usar HTTPS.");
    location.href = 'https:' + window.location.href.substring(window.location.protocol.length);
  }
  </script>

</body>

<script>
let seguridadActiva = false;
let tipo = "auto";
let origen = "https://www.google.com/images/branding/googlelogo/2x/googlelogo_light_color_92x30dp.png"; // Imagen ligera

function medirVelocidad(tipo, origen) {
  return new Promise(resolve => {
    const inicio = performance.now();
    const img = new Image();
    img.src = origen + "?t=" + inicio;
    img.onload = () => {
      const fin = performance.now();
      const tiempo = (fin - inicio) / 1000;
      const tamaño = 70 * 8; // 70 KB en bits
      const mbps = (tamaño / tiempo) / 1000000;
      resolve(mbps);
    };
    img.onerror = () => resolve(0.01);
  });
}

function mostrarEstadoRed(tipo, mbps, origen = "auto") {
  const existente = document.getElementById("estadoRed");
  if (existente) existente.remove();

  const estado = document.createElement("div");
  estado.id = "estadoRed";
  estado.style.position = "fixed";
  estado.style.top = "20px";
  estado.style.right = "20px";
  estado.style.padding = "14px 20px";
  estado.style.borderRadius = "10px";
  estado.style.fontWeight = "bold";
  estado.style.fontSize = "0.95em";
  estado.style.zIndex = "9999";
  estado.style.boxShadow = "0 0 12px #00c3ff";
  estado.style.background = "#0f0f0f";
  estado.style.color = "#00c3ff";
  estado.style.border = "2px solid #00c3ff";
  estado.style.whiteSpace = "pre-line";

  let mensaje = `📶 Red: ${tipo.toUpperCase()}\n⚡ Velocidad: ${mbps.toFixed(2)} Mbps`;

  if (mbps < 10) {
    mensaje += `\n⚠️ Red inestable. Seguridad reforzada.`;
  } else {
    mensaje += `\n✅ Red estable. Puedes continuar.`;
  }

  estado.textContent = mensaje;
  document.body.appendChild(estado);

  setTimeout(() => {
    estado.style.opacity = "0";
    estado.style.transition = "opacity 0.5s ease";
    setTimeout(() => estado.remove(), 6000);
  }, 8000);
}

function activarSeguridadVisual() {
  if (document.getElementById("loaderExtra")) return;

  const loaderExtra = document.createElement("div");
  loaderExtra.id = "loaderExtra";
  loaderExtra.style.position = "fixed";
  loaderExtra.style.top = "0";
  loaderExtra.style.left = "0";
  loaderExtra.style.width = "100%";
  loaderExtra.style.height = "100%";
  loaderExtra.style.background = "#000000e0";
  loaderExtra.style.display = "flex";
  loaderExtra.style.alignItems = "center";
  loaderExtra.style.justifyContent = "center";
  loaderExtra.style.zIndex = "99999";
  loaderExtra.style.color = "#00c3ff";
  loaderExtra.style.fontSize = "1.2em";
  loaderExtra.style.fontFamily = "Segoe UI, sans-serif";
  loaderExtra.innerHTML = `<div style="text-align:center;">
    <div style="width:50px;height:50px;border:6px solid #00c3ff;border-top:6px solid transparent;border-radius:50%;animation:spin 1s linear infinite;margin:auto;"></div>
    <p>Red inestable. Reforzando seguridad...</p>
  </div>`;
  document.body.appendChild(loaderExtra);

  const audio = document.querySelector("audio");
  if (audio) audio.pause();
}

function desactivarSeguridadVisual() {
  const loaderExtra = document.getElementById("loaderExtra");
  if (loaderExtra) loaderExtra.remove();

  const audio = document.querySelector("audio");
  if (audio) audio.play();
}

function verificarEstabilidadRed() {
  const red = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const tipoRed = red ? red.effectiveType || red.type : "desconocido";

  medirVelocidad(tipoRed, origen).then(mbps => {
    mostrarEstadoRed(tipoRed, mbps);

    if (mbps < 10 && !seguridadActiva) {
      seguridadActiva = true;
      activarSeguridadVisual();
    }

    if (mbps >= 10 && seguridadActiva) {
      seguridadActiva = false;
      desactivarSeguridadVisual();
    }
  });
}

// Ejecutar cada 5 segundos
setInterval(verificarEstabilidadRed, 5000);

// Animación CSS
const estiloAnimacion = document.createElement("style");
estiloAnimacion.innerHTML = `
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}`;
document.head.appendChild(estiloAnimacion);
      </script>
  
</html>
